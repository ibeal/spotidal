services:
  spotidal:
    build: .
    image: ghcr.io/ibeal/spotidal:latest
    volumes:
      - ./data:/data
    environment:
      # standard 5-field cron syntax; defaults to every 6 hours
      CRON_SCHEDULE: "0 */6 * * *"
      # Optional Uptime Kuma Push monitor URL, typically supplied by a server-side .env file.
      UPTIME_KUMA_PUSH_URL: ${UPTIME_KUMA_PUSH_URL:-}
    restart: unless-stopped
